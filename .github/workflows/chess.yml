name: GitHub Readme Chess Bot

on:
  issues:
    types: [opened]

jobs:
  play-chess:
    if: startsWith(github.event.issue.title, 'Chess:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Chess Engine
        run: |
          go run main.go "${{ github.event.issue.title }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git commit -m "Chess move: ${{ github.event.issue.title }}" || exit 0
          git push

      - name: Close the Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            })
